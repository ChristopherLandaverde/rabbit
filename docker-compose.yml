# Multi-Touch Attribution API - Docker Compose Configuration

version: '3.8'

services:
  # Postgres for v2 persistence
  postgres:
    image: postgres:16-alpine
    container_name: attribution-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: rabbit
      POSTGRES_PASSWORD: rabbit_dev
      POSTGRES_DB: rabbit
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rabbit -d rabbit"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - attribution-network

  # Redis for caching, rate limiting, and idempotency cache
  redis:
    image: redis:7-alpine
    container_name: attribution-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - attribution-network

  # Attribution API
  attribution-api:
    build: .
    container_name: attribution-api
    ports:
      - "8000:8000"
    environment:
      # Security
      - ENABLE_API_KEY_AUTH=true
      - DEFAULT_RATE_LIMIT=1000
      - API_KEY_TTL_SECONDS=2592000
      
      # Redis Configuration
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0

      # v2 Configuration
      - RABBIT_V2_ENABLED=true
      - DATABASE_URL=postgresql+asyncpg://rabbit:rabbit_dev@postgres:5432/rabbit
      - ADMIN_BOOTSTRAP_KEY=admin_dev_change_me
      - RABBIT_WEBHOOK_SECRET_KEY=dev_webhook_key_32_bytes_padded__
      
      # Logging
      - LOG_LEVEL=INFO
      - ENABLE_SECURITY_LOGGING=true
      
      # File Processing
      - MAX_FILE_SIZE_MB=100
      - MAX_CONCURRENT_REQUESTS=10
      - MAX_MEMORY_USAGE_GB=2.0
      
      # Processing Timeouts
      - PROCESSING_TIMEOUT_SECONDS=300
      - SMALL_FILE_TIMEOUT_SECONDS=5
      
      # Attribution Model Defaults
      - DEFAULT_TIME_DECAY_HALF_LIFE_DAYS=7.0
      - CONFIDENCE_THRESHOLD=0.7
      
      # Data Quality Thresholds
      - MINIMUM_DATA_COMPLETENESS=0.8
      - MINIMUM_DATA_CONSISTENCY=0.7
    volumes:
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - attribution-network
    restart: unless-stopped

  # Frontend Application
  attribution-frontend:
    build: ./frontend
    container_name: attribution-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000
      - NODE_ENV=production
    depends_on:
      - attribution-api
    networks:
      - attribution-network
    restart: unless-stopped

  # Nginx Load Balancer (optional)
  nginx:
    image: nginx:alpine
    container_name: attribution-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - attribution-api
      - attribution-frontend
    networks:
      - attribution-network
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:

networks:
  attribution-network:
    driver: bridge
