name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: v1
            test-command: python -m pytest -q --ignore=tests/v2
          - suite: v2
            test-command: python -m pytest -q tests/v2
          # One process, as AGENTS.md runs it: catches state leaking between
          # the v1 and v2 suites (e.g. logger handlers) that split runs miss.
          - suite: full
            test-command: python -m pytest -q
    name: pytest (${{ matrix.suite }})
    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_DB: 0
      DATABASE_URL: postgresql+asyncpg://rabbit:rabbit@127.0.0.1:5432/rabbit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rabbit
          POSTGRES_USER: rabbit
          POSTGRES_PASSWORD: rabbit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rabbit -d rabbit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Run pytest
        run: ${{ matrix.test-command }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
