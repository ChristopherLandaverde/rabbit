[pytest]
# No testpaths: collection starts at the repository root, so the root-level
# test_setup.py and test_simple.py run alongside tests/ (CI relies on this).
# Default norecursedirs already skips node_modules, venv, build and dot-dirs.
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for different test types
markers =
    unit: Unit tests for individual components
    integration: Integration tests for API endpoints
    performance: Performance and benchmark tests
    slow: Tests that take longer to run
    algorithm: Tests for attribution algorithm correctness
    needs_redis: Requires a reachable Redis service

# Output options
addopts = --tb=short --strict-markers --disable-warnings --durations=10

# Coverage is opt-in, e.g.:
#   python -m pytest --cov=src --cov-report=term-missing --cov-branch

# Async support: run every `async def` test on pytest-asyncio's event loop.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
